<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!--This is to call on the css file-->
    <link rel="stylesheet" href="hello.css">

    <!--JavaScript code where you can create a function and declare variables-->
    <script>
        function myFunction() {
            var newname = document.getElementById("fname").value;
            document.getElementById("greeting").innerHTML = "Hello  " + newname + " !";
        }
    </script>
    <!--end of the function behavior that changes the name of the blank paragraph-->
</head>

<body>
    <h1>Hello!</h1>

    <form>
        <label for="fname">What's your name?</label>
        <input type="text" id="fname" name="fname"><br>
    </form>
    <button type="button" onclick="myFunction()">Press me</button>
    <!--when the button is clicked, it calls to the function-->

    <br>
    <p id="greeting">  </p> <!--empty paragraph that changes in the function behavior / html code-->
    <br>
</body>
</html>
