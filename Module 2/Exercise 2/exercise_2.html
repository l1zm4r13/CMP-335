<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 2 Exercise - API Calls</title>

    <link rel="stylesheet" href="exercise_2.css">
    <script src="exercise_2.js"></script>
</head>
<body>
    <h1>Web Service API Consumer Example</h1>
    <div class="myflexboxRow">
        <div class="myflexboxColumn">

            <h2>Obtain user information</h2>

            <label>What type of Bacon Ipsum?</label>
            <br>
            <input type="radio" id="allMeat" name="meatType" value="all-meat" checked>
            <label for="allMeat">All Meat</label>
            <br>
            <input type="radio" id="meatFiller" name="meatType" value="meat-and-filler">
            <label for="meatFiller">Meat and Filler</label>
            <br><br>

            <label for="cipher">Cipher Algorithm:</label>
            <select id="cipher">
                <option value="caesar">Caesar Cipher</option>
                <option value="reverse">Reverse Cipher</option>
            </select>
            <br><br>

            <label for="newParagraphs">How many paragraphs?</label>
            <select id="newParagraphs">
                <option value=1>1</option>
                <option value=2>2</option>
                <option value=3>3</option>
                <option value=4>4</option>
                <option value=5>5</option>
            </select><br /><br />

            <input type="button" value="Get my Bacon Ipsum!" onclick="getBaconipsum()">
        </div>
        <div class="myflexboxColumn">
            <h2>Returned data in raw JSON</h2>
            <p id="myRawData">
            </p>
        </div>
        <div class="myflexboxColumn">
            <h2>Returned data as formatted paragraphs</h2>
            <p id="myFormattedData">
            </p>
        </div>
        <div class="myflexboxColumn">
            <h2>Returned data encrypted</h2>
            <p id="myEncryptedData"></p>
        </div>
    </div>    
</body>
</html>
