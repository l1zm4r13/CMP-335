<!--declare document type and language-->
<!DOCTYPE html>
<html lang="en">
<!-- head section with meta information, title, and links to CSS and JS files -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 2 Assignment 1 - Palindrome Checker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--My css and js file -->
    <link rel="stylesheet" href="assignment_1Liz.css">
    <script src="assignment_1Liz.js"></script>
</head>
<!-- body section with a form for user input -->
<body>
    <h1>Palindrome Checker</h1>
    <div class="myflexboxRow">
        <div class="myflexboxColumn">
            <form id="palindromeForm">
                <label for="newWord">Enter a word:</label>
                <input type="text" id="newWord" name="newWord">
                <br><br>
                
                <label for="newNumber">Enter 1, 2, or 3 for the algorithm:</label>
                <input type="number" id="newNumber" name="newNumber">
                <br><br>

                <label>Case sensitivity:</label>
                <br>
                <input type="radio" id="caseSensitive" name="caseOption" value="sensitive" checked>
                <label for="caseSensitive">Case Sensitive</label>
                <input type="radio" id="caseInsensitive" name="caseOption" value="insensitive">
                <label for="caseInsensitive">Case Insensitive</label>
                <br><br>
                
                <input type="button" value="Check Palindrome" onclick="validateANDcheck()">
            </form>
        </div>
        <!-- divs to display results for algorithm 1 -->
        <div class="myflexboxColumn">
                <h2>Algorithm 1 Results</h2>
                <ul id="algorithm1Results"></ul>
        </div>
        
        <!-- divs to display results for algorithm 2 -->
        <div class="myflexboxColumn">
            <h2>Algorithm 2 Results</h2>
            <ul id="algorithm2Results"></ul>
        </div>

        <!-- divs to display results for algorithm 3 -->
        <div class="myflexboxColumn">
            <h2>Algorithm 3 Results</h2>
            <ul id="algorithm3Results"></ul>
        </div>
    </div>
</body>
</html>
