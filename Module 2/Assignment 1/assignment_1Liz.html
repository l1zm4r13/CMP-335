<!--declare document type and language-->
<!DOCTYPE html>
<html lang="en">
<!-- head section with meta information, title, and links to CSS and JS files -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 2 Assignment 1 - Palindrome Checker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--My css and js file -->
    <link rel="stylesheet" href="assignment_1Liz.css">
    <script src="assignment_1Liz.js"></script>
</head>
<!-- body section with a form for user input -->
<body class="p-3">
    <h1 class="mb-4">Palindrome Checker</h1>
    <!-- form for user input with labels, input fields, and a button to check for palindromes -->
    <div class="myflexboxRow">
        <div class="myflexboxColumn">
            <!-- form for user input -->
            <form id="palindromeForm">
                <label for="newWord">Enter a word:</label>
                <input type="text" class="form-control" id="newWord" name="newWord">
                <br><br>
                <!-- input field for selecting the algorithm to use -->
                <label for="newNumber">Enter 1, 2, or 3 for the algorithm:</label>
                <input type="number" class="form-control" id="newNumber" name="newNumber">
                <br><br>
                <!-- radio buttons for selecting case sensitivity -->
                <label>Case sensitivity:</label>
                <div class="form-check">
                    <input type="radio" class="form-check-input" id="caseSensitive" name="caseOption" value="sensitive" checked>
                    <label class="form-check-label" for="caseSensitive">Case Sensitive</label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" id="caseInsensitive" name="caseOption" value="insensitive">
                    <label class="form-check-label" for="caseInsensitive">Case Insensitive</label>
                </div>
                <br>
                <!-- button to check for palindromes -->
                <input type="button" class="btn btn-primary" value="Check Palindrome" onclick="validateANDcheck()">
            </form>
        </div>
        <!-- divs to display results for algorithm 1 -->
        <div class="myflexboxColumn">
            <div class="card mb-3">
                <div class="card-body">
                    <h2 class="card-title">Algorithm 1 Results</h2>
                    <ul id="algorithm1Results"></ul>
                </div>
            </div>
        </div>
        
        <!-- divs to display results for algorithm 2 -->
        <div class="myflexboxColumn">
            <div class="card mb-3">
                <div class="card-body">
                    <h2 class="card-title">Algorithm 2 Results</h2>
                    <ul id="algorithm2Results"></ul>
                </div>
            </div>   
        </div>

        <!-- divs to display results for algorithm 3 -->
        <div class="myflexboxColumn">
            <div class="card mb-3">
                <div class="card-body">
                    <h2 class="card-title">Algorithm 3 Results</h2>
                    <ul id="algorithm3Results"></ul>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
