<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Disney Character Explorer</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assignment_2Liz.css">
    <script src="assignment_2Liz.js" defer></script>
</head>

<body>
    <div class="container mt-4">
        <h1>Disney Character Explorer</h1>
        <form id="characterForm" onsubmit="getDisneyCharacter(); return false;">
            <label for="characterName" class="form-label">Enter a Disney character:</label>
            <input type="text" class="form-control mb-3" id="characterName" name="characterName">
            <input type="submit" class="btn btn-primary" value="Search Character">
        </form>
    </div>
    <div class="container mt-4">
        <h2>Character Results</h2>
        <div id="characterResults" class="row g-3" aria-live="polite"></div>
    </div>
</body>
</html>
