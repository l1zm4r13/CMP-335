<!doctype html>
<html lang="en" class="h-100" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Generate random quotes from Stranger Things using a public API." />
    <meta name="author" content="Mark Otto, Jacob Thornton, and Bootstrap contributors" />

    <title>Stranger Things Quote Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="theme-color" content="#712cf9" />
    <link href="cover.css" rel="stylesheet" />
  </head>
  <body class="d-flex h-100 text-center text-bg-dark">
    <div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">
      <header class="mb-auto"></header>
      <main class="px-3">
        <h1>Stranger Things Quote Generator</h1>
        <p class="lead">
          Explore the Upside Down with random quotes from Stranger Things!
          Click the button below to discover a quote from the series.
        </p>
        <p class="lead">
          <button type="button" class="btn btn-lg btn-light fw-bold border-white bg-white" onclick="getQuote()">
            Generate Quote
          </button>
        </p>
        <div id="quoteResults" class="mt-4" aria-live="polite"></div>
      </main>
      <footer class="mt-auto text-white-50">
        <p>
          Stranger Things Quote Generator |
          Built with <a href="https://getbootstrap.com/" class="text-white">Bootstrap</a>
        </p>
      </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script_Liz.js"></script>
  </body>
</html>
